<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <title>FPT Shop · Tư vấn Laptop</title>
  <style>
    :root{
      /* FPT brand palette */
      --fpt-orange:#F37021;
      --fpt-green:#00A651;
      --fpt-blue:#0072BC;
      --fpt-red:#E4002B;
      --brand-grad: linear-gradient(135deg,#FF9A2E 0%,#F3551E 48%,#E4002B 100%);

      /* Light retail theme */
      --bg:#eceff5;
      --surface:#ffffff;
      --surface-2:#f5f7fb;
      --text:#1c2430;
      --muted:#75808f;
      --border:#e7eaf1;
      --border-strong:#d8dde8;
      --shadow:0 10px 30px rgba(20,28,46,.08);
      --shadow-lg:0 24px 60px rgba(20,28,46,.18);

      --ok-bg:#e7f7ee; --ok-fg:#0a8a45;
      --warn-bg:#fff4e2; --warn-fg:#b9701a;
      --bad-bg:#fdeaec; --bad-fg:#c41229;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(900px 600px at 12% -5%, rgba(243,112,33,.16), transparent 60%),
        radial-gradient(800px 600px at 95% 8%, rgba(228,0,43,.12), transparent 55%),
        var(--bg);
      color:var(--text);
      height:100vh; display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .app{
      width:min(1140px, 100%);
      height:min(920px, 100%);
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:var(--shadow-lg);
      display:flex; overflow:hidden;
    }

    /* ============ Sidebar ============ */
    .sidebar{
      width:330px;
      background:var(--surface);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
    }
    .side-header{
      position:relative;
      padding:22px 20px 20px;
      background:var(--brand-grad);
      color:#fff;
      overflow:hidden;
    }
    .side-header::after{
      content:"";
      position:absolute; right:-40px; top:-40px;
      width:160px; height:160px; border-radius:50%;
      background:rgba(255,255,255,.14);
    }
    .logo{
      display:inline-flex; align-items:baseline; gap:8px;
      background:#fff;
      padding:7px 12px;
      border-radius:12px;
      box-shadow:0 6px 16px rgba(0,0,0,.15);
      font-weight:900; font-size:22px; letter-spacing:-.5px;
      line-height:1;
    }
    .logo .f{color:var(--fpt-orange)}
    .logo .p{color:var(--fpt-green)}
    .logo .t{color:var(--fpt-blue)}
    .logo .shop{
      color:var(--fpt-red); font-size:14px; font-weight:800;
      letter-spacing:0;
    }
    .title{
      font-weight:800; font-size:17px; margin:16px 0 4px;
      position:relative;
    }
    .subtitle{
      margin:0; color:rgba(255,255,255,.88); font-size:13px; line-height:1.4;
      position:relative;
    }
    .settings{
      padding:18px 18px 6px;
      display:flex; flex-direction:column; gap:12px;
    }
    label{
      font-size:11px; color:var(--muted); display:block; margin-bottom:6px;
      font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    }
    input[type="text"]{
      width:100%; padding:11px 12px;
      background:var(--surface-2);
      border:1px solid var(--border-strong);
      border-radius:11px;
      color:var(--text);
      font-size:13px;
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    input[type="text"]:focus{
      border-color:var(--fpt-orange);
      box-shadow:0 0 0 3px rgba(243,112,33,.16);
    }
    .btn{
      padding:11px 12px;
      border-radius:11px;
      border:none;
      background:var(--brand-grad);
      color:#fff;
      cursor:pointer;
      font-weight:700; font-size:13px;
      flex:1;
      box-shadow:0 6px 16px rgba(228,0,43,.22);
      transition:transform .08s ease, filter .15s ease;
    }
    .btn:hover{filter:brightness(1.05); transform:translateY(-1px)}
    .btn.secondary{
      background:var(--surface-2);
      color:var(--text);
      border:1px solid var(--border-strong);
      box-shadow:none;
    }
    .btn.secondary:hover{background:#eef1f7}
    .divider{height:1px; background:var(--border); margin:6px 0;}
    .hint{
      margin-top:auto;
      padding:16px 18px;
      color:var(--muted); font-size:12px; line-height:1.5;
      border-top:1px solid var(--border);
      background:var(--surface-2);
    }
    .hint b{color:var(--fpt-red)}

    /* ============ Main ============ */
    .main{
      flex:1;
      display:flex; flex-direction:column;
      background:var(--surface-2);
      min-width:0;
    }
    .topbar{
      display:flex; align-items:center; gap:10px;
      padding:14px 20px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .topbar .avatar{
      width:38px; height:38px; border-radius:50%;
      background:var(--brand-grad);
      display:grid; place-items:center;
      color:#fff; font-weight:900; font-size:15px;
      box-shadow:0 6px 14px rgba(228,0,43,.25);
    }
    .topbar .who{font-weight:800; font-size:14px; line-height:1.2}
    .topbar .status{
      display:flex; align-items:center; gap:6px;
      font-size:12px; color:var(--muted);
    }
    .topbar .status .led{
      width:8px; height:8px; border-radius:50%;
      background:var(--fpt-green);
      box-shadow:0 0 0 3px rgba(0,166,81,.18);
    }
    .chat{
      flex:1;
      padding:20px 20px 12px;
      overflow:auto;
    }
    .msg{
      display:flex;
      margin:12px 0;
      gap:10px;
      align-items:flex-end;
    }
    .msg.user{justify-content:flex-end}
    .msg.bot::before{
      content:"FS";
      flex:0 0 auto;
      width:30px; height:30px; border-radius:50%;
      background:var(--brand-grad);
      color:#fff; font-size:11px; font-weight:900;
      display:grid; place-items:center;
      box-shadow:0 4px 10px rgba(228,0,43,.22);
    }
    .bubble{
      max-width:76%;
      padding:12px 14px;
      border-radius:16px;
      white-space:pre-wrap;
      line-height:1.5;
      font-size:14px;
      box-shadow:var(--shadow);
    }
    .msg.user .bubble{
      background:var(--brand-grad);
      color:#fff;
      border-bottom-right-radius:5px;
    }
    .msg.bot .bubble{
      background:var(--surface);
      border:1px solid var(--border);
      border-bottom-left-radius:5px;
    }
    .bubble strong{font-weight:800}

    /* ============ Recommendations cards ============ */
    .rec-wrap{
      margin:12px 0 0 40px;
      padding:14px;
      border:1px solid var(--border);
      border-radius:16px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }
    .rec-header{
      display:flex; justify-content:space-between; align-items:center;
      gap:10px; margin-bottom:12px;
    }
    .rec-title{
      font-weight:800; font-size:14px; color:var(--text);
      display:flex; align-items:center; gap:8px;
    }
    .rec-title::before{
      content:""; width:4px; height:16px; border-radius:4px;
      background:var(--brand-grad);
    }
    .rec-meta{font-size:12px; color:var(--muted)}
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:12px;
    }
    @media (max-width: 1040px){
      .grid{grid-template-columns: 1fr;}
      .sidebar{display:none}
      .bubble{max-width:88%}
      .rec-wrap{margin-left:0}
    }
    .card{
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      background:var(--surface);
      cursor:pointer;
      position:relative;
      overflow:hidden;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .card::before{
      content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
      background:var(--brand-grad);
      opacity:0; transition:opacity .12s ease;
    }
    .card:hover{
      transform: translateY(-3px);
      box-shadow:0 14px 30px rgba(20,28,46,.12);
      border-color:var(--border-strong);
    }
    .card:hover::before{opacity:1}
    .card-top{
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
      margin-bottom:10px;
    }
    .card-top > div:first-child{min-width:0; flex:1 1 auto;}
    .card-top > div:last-child{flex:0 0 auto; text-align:right;}
    .card-name{
      font-weight:800; font-size:14px; line-height:1.35; margin:0;
      color:var(--text);
      overflow-wrap:anywhere;
    }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      font-size:11px; font-weight:700;
      padding:5px 9px;
      border-radius:999px;
      color:var(--text);
      background:var(--surface-2);
      border:1px solid var(--border);
      white-space:nowrap;
    }
    .chip.ok{background:var(--ok-bg); color:var(--ok-fg); border-color:transparent}
    .chip.warn{background:var(--warn-bg); color:var(--warn-fg); border-color:transparent}
    .chip.bad{background:var(--bad-bg); color:var(--bad-fg); border-color:transparent}
    .line{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
    .kv{
      font-size:12px; color:var(--muted);
      border:1px solid var(--border);
      background:var(--surface-2);
      border-radius:9px;
      padding:5px 9px;
    }
    .price{
      font-size:16px; font-weight:900;
      color:var(--fpt-red);
      white-space:nowrap;
    }
    .brand{
      font-size:12px; color:var(--muted); margin-top:3px;
      text-transform:capitalize; font-weight:600;
    }
    .score{font-size:12px; color:var(--muted); margin-top:6px;}

    /* Debug collapsible */
    details{
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--surface);
      margin:10px 0 0 40px;
      overflow:hidden;
    }
    summary{
      cursor:pointer; padding:11px 14px;
      font-weight:700; font-size:13px; color:var(--text);
      user-select:none; list-style:none;
    }
    summary::-webkit-details-marker{display:none}
    .details-body{padding:0 14px 14px; color:var(--muted); font-size:12px;}
    pre{
      margin:8px 0 0; padding:12px;
      background:#0f1729; color:#cbd5e1;
      border-radius:10px;
      overflow:auto; font-size:12px; line-height:1.5;
    }

    /* ============ Composer ============ */
    .composer{
      padding:14px 16px;
      border-top:1px solid var(--border);
      display:flex; gap:10px; align-items:flex-end;
      background:var(--surface);
    }
    textarea{
      flex:1; resize:none;
      min-height:48px; max-height:180px;
      padding:13px 14px;
      border-radius:14px;
      border:1px solid var(--border-strong);
      background:var(--surface-2);
      color:var(--text);
      outline:none; font-size:14px; line-height:1.4;
      font-family:inherit;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    textarea:focus{
      border-color:var(--fpt-orange);
      box-shadow:0 0 0 3px rgba(243,112,33,.15);
    }
    .send{
      min-width:112px; height:48px;
      border-radius:14px; border:none;
      background:var(--brand-grad);
      color:#fff; font-weight:800; font-size:14px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(228,0,43,.28);
      transition:transform .08s ease, filter .15s ease;
    }
    .send:hover{filter:brightness(1.05); transform:translateY(-1px)}
    .send:disabled{opacity:.6; cursor:not-allowed; transform:none; filter:none}

    /* Typing */
    .typing{
      display:inline-flex; gap:5px; align-items:center;
      color:var(--muted); font-size:13px;
    }
    .dot{
      width:7px; height:7px; border-radius:999px;
      background:var(--fpt-orange);
      animation: blink 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s; background:var(--fpt-red)}
    .dot:nth-child(3){animation-delay:.30s; background:var(--fpt-red)}
    @keyframes blink{
      0%, 80%, 100%{opacity:.25; transform:translateY(0)}
      40%{opacity:1; transform:translateY(-3px)}
    }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0;
      background:rgba(15,23,42,.5);
      backdrop-filter:blur(3px);
      display:none; align-items:center; justify-content:center;
      padding:18px; z-index:9999;
    }
    .modal{
      width:min(720px, 100%);
      max-height:min(86vh, 100%);
      overflow:auto;
      border-radius:18px;
      border:1px solid var(--border);
      background:var(--surface);
      box-shadow:var(--shadow-lg);
    }
    .modal-header{
      display:flex; justify-content:space-between; align-items:flex-start;
      gap:12px; padding:18px 20px;
      background:var(--brand-grad);
      color:#fff;
      position:sticky; top:0;
    }
    .modal-title{margin:0; font-size:17px; font-weight:900; line-height:1.3;}
    .modal-sub{margin:5px 0 0; color:rgba(255,255,255,.9); font-size:12px; text-transform:capitalize;}
    .close{
      border:none;
      background:rgba(255,255,255,.2);
      color:#fff;
      border-radius:10px; padding:8px 11px;
      cursor:pointer; font-weight:800; min-width:42px;
      transition:background .15s ease;
    }
    .close:hover{background:rgba(255,255,255,.32)}
    .modal-body{padding:18px 20px 22px;}
    .modal-grid{display:grid; grid-template-columns: 1.1fr .9fr; gap:12px;}
    @media (max-width: 860px){.modal-grid{grid-template-columns:1fr;}}
    .panel{
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface-2);
      padding:14px 16px;
    }
    .panel h4{margin:0 0 10px; font-size:13px; font-weight:900; color:var(--fpt-red);}
    .row{
      display:grid; grid-template-columns: 170px 1fr;
      gap:10px; padding:9px 0;
      border-top:1px dashed var(--border-strong);
      font-size:13px;
    }
    .row:first-of-type{border-top:none}
    .k{color:var(--muted); font-weight:600}
    .v{color:var(--text)}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-header">
        <span class="logo">
          <span class="f">F</span><span class="p">P</span><span class="t">T</span>
          <span class="shop">Shop</span>
        </span>
        <p class="title">Trợ lý tư vấn Laptop</p>
        <p class="subtitle">Chọn đúng máy, đúng nhu cầu — nhanh & chuẩn gu FPT.</p>
      </div>

      <div class="settings">
        <div>
          <label>API URL</label>
          <input id="apiUrl" type="text" value="http://127.0.0.1:8090/chat/stream" />
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn secondary" id="btnNew">＋ Mới</button>
          <button class="btn" id="btnUse">Dùng gợi ý</button>
        </div>
        <div class="divider"></div>
        <div>
          <label>Câu hỏi mẫu</label>
          <input id="suggestion" type="text"
                 value="Mình cần mua trả góp 1 laptop văn phòng nhẹ Asus hoặc Dell tầm 15-20tr cho sinh viên, có quà tặng thì tốt" />
        </div>
      </div>

      <div class="hint">
        <div><b>Mẹo:</b> Cứ mô tả nhu cầu tự nhiên — ngân sách, hãng, mục đích dùng, cân nặng… trợ lý sẽ lọc giúp.</div>
        <div style="margin-top:8px;">Trả lời được stream theo thời gian thực qua <code>/chat/stream</code>.</div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="avatar">FS</div>
        <div>
          <div class="who">FPT Shop Advisor</div>
          <div class="status"><span class="led"></span> Trực tuyến · sẵn sàng tư vấn</div>
        </div>
      </div>

      <div class="chat" id="chat"></div>

      <div class="composer">
        <textarea id="input" placeholder="Dạ, FPT Shop có thể giúp gì cho anh/chị hôm nay ạ? (Enter để gửi)"></textarea>
        <button class="send" id="send">Gửi</button>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <h3 class="modal-title" id="modalTitle"></h3>
          <div class="modal-sub" id="modalSub"></div>
        </div>
        <button class="close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiUrlEl = document.getElementById('apiUrl');
    const btnNew = document.getElementById('btnNew');
    const btnUse = document.getElementById('btnUse');
    const suggestionEl = document.getElementById('suggestion');

    // Modal elements
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalClose = document.getElementById('modalClose');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const modalBody = document.getElementById('modalBody');

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function formatVND(n){
      if(n === null || n === undefined) return '-';
      try{
        return Number(n).toLocaleString('vi-VN') + ' đ';
      }catch(e){
        return String(n);
      }
    }

    function escapeHTML(value){
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function addMessage(role, text){
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = formatText(text);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function addTyping(){
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = `Đang kết nối FPT Shop <span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
      bubble.appendChild(typing);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function addDebugPanel(resp){
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = 'Xem thông số kỹ thuật đã lọc';
      details.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'details-body';

      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(resp, null, 2);

      body.appendChild(pre);
      details.appendChild(body);
      chatEl.appendChild(details);
      scrollToBottom();
    }

    function renderRecommendationsGrid(recs, titleText){
      if(!Array.isArray(recs) || recs.length === 0) return;

      const wrap = document.createElement('div');
      wrap.className = 'rec-wrap';

      const header = document.createElement('div');
      header.className = 'rec-header';

      const title = document.createElement('div');
      title.className = 'rec-title';
      title.textContent = titleText || `Gợi ý mẫu phù hợp từ FPT Shop (${recs.length})`;

      const meta = document.createElement('div');
      meta.className = 'rec-meta';
      meta.textContent = 'Bấm để xem thông số';

      header.appendChild(title);
      header.appendChild(meta);
      wrap.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'grid';

      recs.forEach((r, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;

        const top = document.createElement('div');
        top.className = 'card-top';

        const left = document.createElement('div');
        const name = document.createElement('p');
        name.className = 'card-name';
        name.textContent = `${idx+1}. ${r.name ?? 'Unknown laptop'}`;

        const brand = document.createElement('div');
        brand.className = 'brand';
        brand.textContent = `Hãng: ${(r.brand ?? r.manufacturer ?? '—')}`;

        left.appendChild(name);
        left.appendChild(brand);

        const right = document.createElement('div');
        const price = document.createElement('div');
        price.className = 'price';
        price.textContent = formatVND(r.price_vnd ?? r.price ?? r["Price (VND)"]);
        right.appendChild(price);

        top.appendChild(left);
        top.appendChild(right);

        card.appendChild(top);

        // Key specs
        const specs = document.createElement('div');
        specs.className = 'line';

        const kvs = [
          ['RAM', (r.ram_gb ?? r.ram ?? '-') + 'GB'],
          ['SSD', (r.storage_gb ?? r.storage ?? '-') + 'GB'],
          ['GPU', (r.gpu_model ?? '-')],
          ['Nặng', (r.weight_kg ?? r.weight ?? '-') + 'kg'],
          ['Màn', (r.screen_inch ?? r.screen ?? '-') + '"'],
          ['Hz', (r.refresh_hz ?? r.refresh ?? '-')],
        ];
        kvs.forEach(([k,v]) => {
          const el = document.createElement('span');
          el.className = 'kv';
          el.textContent = `${k}: ${v}`;
          specs.appendChild(el);
        });

        card.appendChild(specs);

        const badges = document.createElement('div');
        badges.className = 'line';
        if(r.is_installment_0){
          const chip = document.createElement('span');
          chip.className = 'chip ok';
          chip.textContent = 'Trả góp 0%';
          badges.appendChild(chip);
        }
        if(r.gifts){
          const chip = document.createElement('span');
          chip.className = 'chip warn';
          chip.textContent = 'Có quà tặng';
          badges.appendChild(chip);
        }
        if(Number(r.student_discount_vnd || 0) > 0){
          const chip = document.createElement('span');
          chip.className = 'chip ok';
          chip.textContent = 'Ưu đãi HSSV';
          badges.appendChild(chip);
        }
        if(badges.children.length){
          card.appendChild(badges);
        }

        card.addEventListener('click', () => openModal(r));
        card.addEventListener('keydown', (e) => {
          if(e.key === 'Enter' || e.key === ' ') openModal(r);
        });

        grid.appendChild(card);
      });

      wrap.appendChild(grid);
      chatEl.appendChild(wrap);
      scrollToBottom();
    }

    function openModal(rec){
      const brand = rec.brand ?? rec.manufacturer ?? '';

      // ===== Header =====
      modalTitle.textContent = rec.name ?? 'Laptop';
      modalSub.textContent = brand ? `Hãng: ${brand}` : '';

      // ===== Body: Details =====
      const panel = document.createElement('div');
      panel.className = 'panel';

      panel.innerHTML = `
        <h4>Thông số cấu hình</h4>

        <div class="row">
        <div class="k">Tên máy</div>
        <div class="v">${escapeHTML(rec.name ?? '-')}</div>
        </div>

        <div class="row">
        <div class="k">Thương hiệu</div>
        <div class="v">${escapeHTML(brand || '-')}</div>
        </div>

        <div class="row">
        <div class="k">Giá bán ưu đãi</div>
        <div class="v">${formatVND(rec.price_vnd ?? rec.price)}</div>
        </div>

        <div class="row">
        <div class="k">Giá gốc</div>
        <div class="v">${rec.original_price_vnd ? formatVND(rec.original_price_vnd) : '-'}</div>
        </div>

        <div class="row">
        <div class="k">Trả góp 0%</div>
        <div class="v">${rec.is_installment_0 ? 'Có hỗ trợ' : '-'}</div>
        </div>

        <div class="row">
        <div class="k">Quà tặng</div>
        <div class="v">${escapeHTML(rec.gifts || '-')}</div>
        </div>

        <div class="row">
        <div class="k">Ưu đãi HSSV</div>
        <div class="v">${Number(rec.student_discount_vnd || 0) > 0 ? formatVND(rec.student_discount_vnd) : '-'}</div>
        </div>

        <div class="row">
        <div class="k">RAM</div>
        <div class="v">${rec.ram_gb ?? '-'} GB</div>
        </div>

        <div class="row">
        <div class="k">Dung lượng ổ cứng</div>
        <div class="v">SSD ${rec.storage_gb ?? '-'} GB</div>
        </div>

        <div class="row">
        <div class="k">Card đồ họa</div>
        <div class="v">${escapeHTML(rec.gpu_model || '-')}</div>
        </div>

        <div class="row">
        <div class="k">Lý do gợi ý</div>
        <div class="v">${escapeHTML(rec.reason || '-')}</div>
        </div>

        <div class="row">
        <div class="k">Khối lượng</div>
        <div class="v">${rec.weight_kg ?? '-'} kg</div>
        </div>

        <div class="row">
        <div class="k">Kích thước màn hình</div>
        <div class="v">${rec.screen_inch ?? '-'} inch</div>
        </div>

        <div class="row">
        <div class="k">Tần số quét màn hình</div>
        <div class="v">${rec.refresh_hz ?? '-'} Hz</div>
        </div>

        <div class="row">
        <div class="k">FPT Shop link</div>
        <div class="v">
          ${rec.url ? `<a href="${escapeHTML(rec.url)}" target="_blank" style="color: #ef4444; text-decoration: underline; font-weight: bold;">Mua tại FPT Shop ↗</a>` : '—'}
        </div>
        </div>
        `;

        modalBody.innerHTML = '';
        modalBody.appendChild(panel);

        modalBackdrop.style.display = 'flex';
        modalBackdrop.setAttribute('aria-hidden', 'false');
    }

    function closeModal(){
      modalBackdrop.style.display = 'none';
      modalBackdrop.setAttribute('aria-hidden', 'true');
    }

    modalClose.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if(e.target === modalBackdrop) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && modalBackdrop.style.display === 'flex') closeModal();
    });

    function setSending(isSending){
      sendBtn.disabled = isSending;
      inputEl.disabled = isSending;
      sendBtn.textContent = isSending ? 'Đang gửi...' : 'Gửi';
    }

    async function handleSend(){
      const text = inputEl.value.trim();
      if(!text) return;

      inputEl.value = '';
      autoResize();
      addMessage('user', text);

      setSending(true);
      const typingNode = addTyping();

      try{
        const url = apiUrlEl.value.trim() || '/chat';
        const payload = { text };

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if(!res.ok){
          const raw = await res.text();
          throw new Error(`HTTP ${res.status}: ${raw}`);
        }

        const contentType = res.headers.get("content-type") || "";
        if (contentType.includes("text/event-stream") || contentType.includes("event-stream")) {
          typingNode.remove();

          const wrap = document.createElement('div');
          wrap.className = 'msg bot';
          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          wrap.appendChild(bubble);
          chatEl.appendChild(wrap);
          scrollToBottom();

          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          let finalRespData = { intent: null, query: null, recommendations: null };

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop(); 

            for (const line of lines) {
              if (!line.trim()) continue;
              try {
                const data = JSON.parse(line);
                if (data.type === "metadata") {
                  finalRespData.intent = data.intent;
                  finalRespData.query = data.query;
                  finalRespData.recommendations = data.recommendations;
                  renderRecommendationsGrid(data.recommendations, 'Danh sách gợi ý FPT Shop');
                } else if (data.type === "text") {
                  bubble.innerHTML += formatText(data.content);
                  scrollToBottom();
                }
              } catch (e) {
                console.error("Parse stream error:", e);
              }
            }
          }

        } else {
          const resp = await res.json();
          typingNode.remove();

          const answer = resp.answer ?? '(Không có câu trả lời)';
          addMessage('bot', answer);

          renderRecommendationsGrid(resp.recommendations, 'Danh sách gợi ý FPT Shop');
        }

      }catch(err){
        typingNode.remove();
        addMessage('bot', `Lỗi gọi API: ${err.message}`);
      }finally{
        setSending(false);
        inputEl.focus();
      }
    }

    function autoResize(){
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    }
    inputEl.addEventListener('input', autoResize);

    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);

    btnNew.addEventListener('click', () => {
      chatEl.innerHTML = '';
      addMessage('bot', 'Dạ FPT Shop xin chào anh/chị. Em có thể tư vấn mẫu laptop nào cho anh/chị hôm nay ạ?');
      inputEl.focus();
    });

    btnUse.addEventListener('click', () => {
      inputEl.value = suggestionEl.value;
      autoResize();
      inputEl.focus();
    });

    function formatText(text){
      if(!text) return '';

      let html = text;

      html = html
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    // initial greet
    addMessage('bot', 'Dạ FPT Shop xin chào anh/chị. Em có thể tư vấn mẫu laptop nào cho anh/chị hôm nay ạ?');
  </script>
</body>
</html>
